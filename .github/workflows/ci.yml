name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./cmd/slash
      - name: install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: shell integration (real interactive shells in a pty)
        run: SLASH_BIN=$PWD/slash python3 -I tests/shell_test.py
