name: ci
# Unit and shell tests on every push. The distro tests (six containers,
# real package managers) run for release tags and when started by hand.
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./cmd/slash
      - name: install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: shell integration (real interactive shells in a pty)
        run: SLASH_BIN=$PWD/slash python3 -I tests/shell_test.py
      - name: "install script: install, use, uninstall, home folder unchanged"
        run: SLASH_BIN=$PWD/slash sh tests/install_test.sh

  distros:
    # The real package managers, shells and offline lookups on each distro.
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13, ubuntu:24.04, fedora:43, archlinux:latest, opensuse/tumbleweed, alpine:edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o slash ./cmd/slash
      - run: tests/distro/docker.sh ${{ matrix.image }} slash
